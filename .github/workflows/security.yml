name: Security

# OWASP-aligned checks (8 Oct 2026): secrets, static analysis, dependency CVEs and a live API
# scan. Runs on every pull request, on pushes to main and dev, and weekly so new CVEs in pinned
# dependencies surface even when the code has not changed. See docs/SECURITY_TESTING.md.

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 1 * * 1' # Mondays 09:00 Singapore time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Scans every commit; reviewed findings are listed in .gitleaksignore.
      - name: Scan git history
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1

  sast:
    name: Static analysis (Semgrep OWASP Top 10, Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Semgrep (OWASP Top 10, Python, TypeScript, React, secrets, GitHub Actions)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0
          semgrep scan
          --config p/owasp-top-ten --config p/python --config p/typescript
          --config p/react --config p/secrets --config p/github-actions
          --exclude node_modules --exclude apps/mobile/android --exclude '**/dist'
          --exclude apps/backend/rag/evaluation
          --severity ERROR --severity WARNING
          --metrics off --error
      - name: Bandit (Python security linter, medium severity and up)
        run: |
          python -m pip install bandit==1.9.4
          bandit -r apps/backend -x apps/backend/tests,apps/backend/rag/evaluation -ll

  dependencies:
    name: Dependency CVEs (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Backend packages (any known vulnerability fails)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r apps/backend/requirements.txt
      # Fails on critical only: the remaining high advisories sit in Expo's build tooling
      # (braces via Metro, node-forge via expo-cli) and clear with the next Expo SDK upgrade.
      - name: npm production packages (critical fails)
        run: npm audit --omit=dev --audit-level=critical

  dast:
    name: Live API scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r apps/backend/requirements.txt
      # Placeholder credentials: the scan probes the API surface unauthenticated, so no real
      # Supabase or OpenAI call is ever made. The OpenAPI spec is served because
      # RAILWAY_ENVIRONMENT is unset here.
      - name: Start backend
        working-directory: apps/backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
          OPENAI_API_KEY: ci-placeholder-openai-key
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 2; done
          cat ../../uvicorn.log
          exit 1
      - name: ZAP API scan (active, from the OpenAPI spec)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-api-scan.py -t http://127.0.0.1:8000/openapi.json -f openapi \
            -r report.html -J report.json -I
      # -I keeps warnings informational; any FAIL-level alert or a 500 in the log fails the job.
      - name: Fail on server errors during the scan
        run: |
          if grep -E 'HTTP/1.1" 5[0-9]{2}' uvicorn.log; then echo "Backend returned 5xx under scan"; exit 1; fi
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap/
