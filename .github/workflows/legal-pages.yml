name: Legal Pages

# Publishes the phone app's Privacy policy and Terms of use to GitHub Pages, built from
# packages/shared/src/legal.ts so the public URL Google Play links to always matches the app.
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - packages/shared/src/legal.ts
      - packages/shared/scripts/render-legal-site.mjs
      - .github/workflows/legal-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Render pages from legal.ts
        run: node packages/shared/scripts/render-legal-site.mjs _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
