name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r apps/backend/requirements-dev.txt

      - name: Typecheck shared package
        run: npm run typecheck:shared

      - name: Typecheck web app
        run: npm run lint:web

      - name: Build web app
        run: npm run build:web

      - name: Lint mobile app
        run: npm run lint:mobile

      - name: Test backend and RAG
        run: python -m unittest discover apps/backend/tests -v
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
          OPENAI_API_KEY: ci-placeholder-openai-key

      - name: Compile backend modules
        run: >-
          python -m py_compile
          apps/backend/main.py
          apps/backend/routers/rag.py
          apps/backend/services/rag_service.py
          apps/backend/services/rate_limiter.py
          apps/backend/rag/retrieval.py
          apps/backend/rag/Implementation/ingest.py
          apps/backend/rag/Implementation/answer.py
          apps/backend/rag/evaluation/report_history.py
          apps/backend/rag/evaluation/eval_retrieval.py
          apps/backend/rag/evaluation/eval_answers.py
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
