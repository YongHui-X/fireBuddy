name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned CLI and workspace dependencies
        run: npm ci
      - name: Start a fresh database and apply committed migrations
        run: npx supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Test database functions, ownership, and rollback
        run: npx supabase test db --local supabase/tests

  checks:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r apps/backend/requirements-dev.txt

      - name: Typecheck shared package
        run: npm run typecheck:shared

      - name: Typecheck web app
        run: npm run lint:web

      - name: Build web app
        run: npm run build:web

      - name: Test web app
        run: npm run test:web

      - name: Lint mobile app
        run: npm run lint:mobile

      - name: Test backend and RAG
        run: python -m unittest discover apps/backend/tests -v
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
          OPENAI_API_KEY: ci-placeholder-openai-key

      - name: Check committed RAG evaluation reports against thresholds
        run: python apps/backend/rag/evaluation/check_regression.py

      - name: Compile backend modules
        run: >-
          python -m py_compile
          apps/backend/main.py
          apps/backend/routers/accounts.py
          apps/backend/routers/ai.py
          apps/backend/routers/categories.py
          apps/backend/routers/expenses.py
          apps/backend/routers/rag.py
          apps/backend/services/rag_service.py
          apps/backend/services/category_visibility.py
          apps/backend/services/debt_calculator.py
          apps/backend/services/ember_figure_tools.py
          apps/backend/services/source_metadata.py
          apps/backend/services/rate_limiter.py
          apps/backend/rag/retrieval.py
          apps/backend/rag/query_terms.py
          apps/backend/rag/Implementation/ingest.py
          apps/backend/rag/Implementation/answer.py
          apps/backend/rag/fetchAndConvert/pdf_to_md.py
          apps/backend/rag/fetchAndConvert/check_figure_drift.py
          apps/backend/rag/evaluation/report_history.py
          apps/backend/rag/evaluation/eval_retrieval.py
          apps/backend/rag/evaluation/eval_answers.py
          apps/backend/rag/evaluation/check_regression.py
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
